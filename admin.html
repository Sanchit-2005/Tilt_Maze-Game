<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Tilt Maze – Admin Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/admin.css" />
  </head>
  <body>
    <main id="app">
      <div id="admin-app">
        <section id="login-view" class="view" aria-labelledby="login-title">
          <p class="eyebrow">Tilt Maze</p>
          <h1 id="login-title">Admin Login</h1>
          <p class="muted">Sign in to manage local scores.</p>
          <form id="login-form" novalidate>
            <div class="field">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" required autocomplete="username" />
            </div>
            <div class="field">
              <label for="password">Password</label>
              <input type="password" id="password" name="password" required autocomplete="current-password" />
            </div>
            <button type="submit" class="btn primary">Login</button>
            <p id="login-error" class="error hidden" role="alert"></p>
          </form>
        </section>

        <section id="dashboard-view" class="view hidden" aria-labelledby="dashboard-title">
          <header class="dashboard-header">
            <div>
              <p class="eyebrow">Tilt Maze</p>
              <h1 id="dashboard-title">Leaderboard Admin</h1>
            </div>
            <div class="header-actions">
              <a id="back-to-game" class="btn secondary" href="/">Back to game</a>
              <button id="logout-btn" class="btn secondary" type="button">Logout</button>
            </div>
          </header>

          <section class="stats-cards" id="stats-cards" aria-label="Leaderboard statistics">
            <article class="stat-card"><span>Total games</span><strong id="total-games">0</strong></article>
            <article class="stat-card"><span>Highest score</span><strong id="highest-score">0</strong></article>
            <article class="stat-card"><span>Average score</span><strong id="average-score">0</strong></article>
          </section>

          <section class="panel" id="scores-panel" aria-labelledby="scores-title">
            <div class="panel-heading">
              <div>
                <p class="eyebrow">Local leaderboard</p>
                <h2 id="scores-title">Scores</h2>
              </div>
              <div class="panel-actions">
                <button id="export-scores" class="btn small" type="button">Export CSV</button>
                <label class="btn small import-label" for="import-json">Import JSON<input id="import-json" type="file" accept="application/json,.json" /></label>
                <button id="clear-scores" class="btn danger small" type="button">Clear all</button>
              </div>
            </div>
            <div class="panel-controls">
              <label class="sr-only" for="score-search">Search scores</label>
              <input type="search" id="score-search" placeholder="Search player names" autocomplete="off" />
              <label class="sr-only" for="score-sort">Sort scores</label>
              <select id="score-sort">
                <option value="score">Score: high to low</option>
                <option value="level">Level: high to low</option>
                <option value="time">Time: fast to slow</option>
                <option value="date">Date: newest first</option>
                <option value="name">Name: A–Z</option>
              </select>
            </div>
            <div class="table-wrap">
              <table class="data-table" id="scores-table">
                <thead>
                  <tr>
                    <th scope="col">Rank</th>
                    <th scope="col">Name</th>
                    <th scope="col">Score</th>
                    <th scope="col">Level</th>
                    <th scope="col">Time</th>
                    <th scope="col">Date</th>
                    <th scope="col"><span class="sr-only">Actions</span></th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
              <p id="scores-empty" class="empty-state hidden">No scores yet</p>
            </div>
            <p id="admin-message" class="message hidden" role="status"></p>
          </section>
        </section>
      </div>
    </main>
    <script src="/admin.js" type="module"></script>
  </body>
</html>
