<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tilt Maze – Admin Dashboard</title>
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <main id="app">
    <!-- Login view -->
    <section id="login-view" class="view">
      <h1>Admin Login</h1>
      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required value="admin@test.com" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required />
        </div>
        <button type="submit" class="btn primary">Login</button>
        <p id="login-error" class="error hidden"></p>
      </form>
    </section>

    <!-- Dashboard view (hidden until logged in) -->
    <section id="dashboard-view" class="view hidden">
      <header class="dashboard-header">
        <h1>Admin Dashboard</h1>
        <button id="logout-btn" class="btn secondary">Logout</button>
      </header>

      <section class="stats-cards" id="stats-cards"></section>

      <section class="panel" id="participants-panel">
        <h2>Participants</h2>
        <div class="panel-controls">
          <input type="text" id="participant-search" placeholder="Search…" />
          <button id="participants-export" class="btn small">Export CSV</button>
        </div>
        <table class="data-table" id="participants-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Registered</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <div class="pagination" id="participants-pagination"></div>
      </section>

      <section class="panel" id="sessions-panel">
        <h2>Game Sessions</h2>
        <div class="panel-controls">
          <select id="session-mode-filter">
            <option value="">All Modes</option>
            <option value="competition">Competition</option>
            <option value="practice">Practice</option>
          </select>
          <button id="sessions-export" class="btn small">Export CSV</button>
        </div>
        <table class="data-table" id="sessions-table">
          <thead>
            <tr>
              <th>Session ID</th>
              <th>Participant</th>
              <th>Mode</th>
              <th>Status</th>
              <th>Score</th>
              <th>Start</th>
              <th>End</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <div class="pagination" id="sessions-pagination"></div>
      </section>

      <section class="panel" id="settings-panel">
        <h2>Game Settings</h2>
        <form id="settings-form" novalidate>
          <div class="field">
            <label for="timerDuration">Timer (seconds)</label>
            <input type="number" id="timerDuration" name="timerDuration" min="10" required />
          </div>
          <div class="field">
            <label for="difficulty">Difficulty</label>
            <select id="difficulty" name="difficulty">
              <option value="easy">Easy</option>
              <option value="medium">Medium</option>
              <option value="hard">Hard</option>
            </select>
          </div>
          <div class="field toggle-field">
            <label for="sessionsEnabled">Enable New Sessions</label>
            <input type="checkbox" id="sessionsEnabled" name="sessionsEnabled" />
          </div>
          <button type="submit" class="btn primary">Save Settings</button>
          <p id="settings-message" class="message hidden"></p>
        </form>
      </section>
    </section>
  </main>
  <script src="admin.js"></script>
</body>
</html>
