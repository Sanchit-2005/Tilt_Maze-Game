<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Tilt Maze</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="tutorial.css" />
    <link rel="stylesheet" href="intro.css" />
  </head>
  <body>
    <button
      id="btn-audio-toggle"
      class="audio-toggle"
      type="button"
      aria-label="Mute sound"
      aria-pressed="false"
      title="Toggle sound (M)"
    >
      <svg class="audio-toggle__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path class="audio-toggle__speaker" d="M4 9.5h4L13 5v14l-5-4.5H4z" />
        <path class="audio-toggle__waves" d="M16 9a4 4 0 0 1 0 6m2.5-8.5a7.5 7.5 0 0 1 0 11" />
        <path class="audio-toggle__slash" d="m4 4 16 16" />
      </svg>
      <span class="audio-toggle__label">Sound</span>
    </button>

    <!-- Opening splash: isolated from the game, tutorial, and HUD. -->
    <div id="intro-splash" class="intro-splash" role="status" aria-label="Tilt Rush introduction">
      <div class="intro-splash__content">
        <h1 class="intro-splash__title" aria-label="Tilt Rush">
          <span aria-hidden="true" style="--i: 0">T</span>
          <span aria-hidden="true" style="--i: 1">I</span>
          <span aria-hidden="true" style="--i: 2">L</span>
          <span aria-hidden="true" style="--i: 3">T</span>
          <span class="intro-splash__space" aria-hidden="true"></span>
          <span class="intro-splash__accent" aria-hidden="true" style="--i: 4">R</span>
          <span class="intro-splash__accent" aria-hidden="true" style="--i: 5">U</span>
          <span class="intro-splash__accent" aria-hidden="true" style="--i: 6">S</span>
          <span class="intro-splash__accent" aria-hidden="true" style="--i: 7">H</span>
        </h1>
        <div class="intro-splash__ball-track" aria-hidden="true">
          <i class="intro-splash__ball"></i>
        </div>
        <p class="intro-splash__tagline">Guide the balls home</p>
      </div>
    </div>

    <!-- Start overlay -->
    <div
      id="overlay-start"
      class="overlay"
      role="dialog"
      aria-modal="true"
      aria-labelledby="start-title"
    >
      <div class="card">
        <h1 id="start-title">Tilt&nbsp;Maze</h1>
        <p>Enter your name to begin</p>
        <input type="text" id="player-name" placeholder="Enter Your Name" maxlength="30" />
        <button id="btn-play" class="btn btn-primary">Start Game</button>
        <button id="btn-leaderboard-start" class="btn btn-secondary" type="button">Leaderboard</button>
        <p id="name-error" class="error hidden"></p>
      </div>
    </div>

    <!-- Pause overlay -->
    <div
      id="overlay-pause"
      class="overlay hidden"
      role="dialog"
      aria-modal="true"
      aria-label="Game paused"
    >
      <div class="card">
        <h2>Paused</h2>
        <div class="divider"></div>
        <button id="btn-resume" class="btn btn-primary">Resume</button>
        <button id="btn-restart" class="btn btn-secondary">
          Restart Level
        </button>
      </div>
    </div>

    <!-- Result overlay -->
    <div
      id="overlay-result"
      class="overlay hidden"
      role="dialog"
      aria-modal="true"
      aria-label="Round result"
    >
      <div class="card">
        <span id="result-badge" class="badge"></span>
        <h2 id="result-title"></h2>
        <div class="stat-row">
          <div class="stat">
            <div class="stat-v" id="res-time">--</div>
            <div class="stat-l">Time</div>
          </div>
          <div class="stat">
            <div class="stat-v" id="res-balls">1</div>
            <div class="stat-l">Balls Left</div>
          </div>
        </div>
        <div class="divider"></div>
        <button id="btn-next" class="btn btn-primary" style="display: none">
          Next Level &#x2192;
        </button>
        <button id="btn-retry" class="btn btn-secondary" style="display: none">
          Retry
        </button>
        <button id="btn-leaderboard-result" class="btn btn-secondary" type="button">
          Leaderboard
        </button>
      </div>
    </div>

    <!-- Tutorial overlay: its canvas and controls are independent of the game canvas. -->
    <div
      id="overlay-tutorial"
      class="overlay hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="tutorial-title"
    >
      <section class="card tutorial-card">
        <div class="tutorial-progress" aria-hidden="true">
          <span class="tutorial-progress__bar" id="tutorial-progress-bar"></span>
        </div>
        <div class="tutorial-content" id="tutorial-content">
          <header class="tutorial-header">
            <div class="tutorial-step-indicator" id="tutorial-step-indicator">
              1 / 6
            </div>
            <h2 id="tutorial-title">Meet the Maze</h2>
            <p id="tutorial-message"></p>
          </header>
          <div class="tutorial-demo">
            <canvas
              id="tutorial-canvas"
              class="tutorial-canvas"
              width="720"
              height="500"
              aria-label="Animated tutorial demonstration"
            ></canvas>
            <p class="tutorial-caption" id="tutorial-caption" aria-live="polite"></p>
          </div>
        </div>
        <footer class="tutorial-footer">
          <div
            class="tutorial-progress-dots"
            id="tutorial-progress-dots"
            aria-label="Tutorial progress"
          ></div>
          <div class="tutorial-controls">
            <button id="btn-tutorial-prev" class="btn btn-secondary" type="button">
              Previous
            </button>
            <button id="btn-tutorial-next" class="btn btn-primary" type="button">
              Next
            </button>
            <button id="btn-start-game" class="btn btn-primary hidden" type="button">
              Start Game
            </button>
            <button id="btn-leaderboard-tutorial" class="btn btn-secondary" type="button">
              Leaderboard
            </button>
            <button id="btn-tutorial-skip" class="btn tutorial-skip" type="button">
              Skip Tutorial
            </button>
          </div>
        </footer>
      </section>
    </div>

    <!-- Game -->
    <div class="game">
      <h1 class="game-title">Tilt Maze</h1>
      <div id="stage"><canvas id="maze" width="900" height="900"></canvas></div>
      <div class="pad" id="pad">
        <button class="u" data-k="ArrowUp" aria-label="Move up"></button>
        <button class="d" data-k="ArrowDown" aria-label="Move down"></button>
        <button class="l" data-k="ArrowLeft" aria-label="Move left"></button>
        <button class="r" data-k="ArrowRight" aria-label="Move right"></button>
        <div class="hub"><i id="nub"></i></div>
      </div>
    </div>

    <!-- HUD bar -->
    <div id="hud" class="hud-hidden">
      <div class="hud-cell">
        <span class="hud-label">Level</span
        ><span class="hud-value" id="hud-level">1</span>
      </div>
      <div class="hud-cell">
        <span class="hud-label">Time</span
        ><span class="hud-value" id="hud-timer">60</span>
      </div>
      <div class="hud-cell">
        <span class="hud-label">Balls</span
        ><span class="hud-value" id="hud-balls">4</span>
      </div>
      <button id="btn-pause" aria-label="Pause game">&#x23F8;</button>
    </div>

    <script src="storage.js" type="module"></script>
    <script src="audio.js" defer></script>
    <script src="script.js" defer></script>
    <script src="tutorial.js" defer></script>
    <script src="intro.js" defer></script>
    <!-- Intro overlay (hidden until name submitted) -->
    <div id="overlay-intro" class="overlay hidden" role="dialog" aria-modal="true" aria-label="Game Intro">
      <div class="card intro-card">
        <h1 class="intro-title">Tilt Maze</h1>
        <p class="intro-subtitle" id="intro-message"></p>
        <div class="loader"></div>
      </div>
    </div>

    <!-- Score prompt shown only after the timer ends. -->
    <div id="overlay-score-entry" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="score-entry-title">
      <div class="card score-entry-card">
        <h2 id="score-entry-title">Save your run</h2>
        <p id="score-entry-summary"></p>
        <form id="score-entry-form" novalidate>
          <label for="score-player-name">Name</label>
          <input type="text" id="score-player-name" maxlength="12" autocomplete="off" />
          <p id="score-entry-error" class="error hidden"></p>
          <button class="btn btn-primary" type="submit">Save Score</button>
          <button id="btn-score-skip" class="btn btn-secondary" type="button">Skip</button>
        </form>
      </div>
    </div>

    <!-- Leaderboard modal. Player text is inserted with textContent in script.js. -->
    <div id="overlay-leaderboard" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="leaderboard-title">
      <div class="card leaderboard-card">
        <div class="leaderboard-heading">
          <h2 id="leaderboard-title">Leaderboard</h2>
          <button id="btn-leaderboard-close" class="leaderboard-close" type="button" aria-label="Close leaderboard">×</button>
        </div>
        <p id="leaderboard-empty" class="leaderboard-empty hidden">No scores yet</p>
        <ol id="leaderboard-list" class="leaderboard-list"></ol>
      </div>
    </div>
  </body>
</html>
